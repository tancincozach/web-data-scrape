name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 app tests
      - name: Formatting
        run: black --check app tests manage.py
      - name: Django checks
        env:
          DJANGO_SETTINGS_MODULE: app.test_settings
        run: python manage.py check
      - name: Tests
        run: pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^WEB_PORT=.*/WEB_PORT=18080/' .env
      - name: Validate Compose
        run: docker compose config >/dev/null
      - name: Build and start
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz/; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Check docs and schema
        run: |
          curl -fsS http://127.0.0.1:18080/api/docs/ | grep -q 'createApiReference'
          curl -fsS -H 'Accept: application/json' http://127.0.0.1:18080/api/schema/ | grep -q '/scrape/data/'
      - name: Cleanup
        if: always()
        run: docker compose down -v

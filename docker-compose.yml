services:
  web-scrape:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_scrape
    hostname: web-scraper
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8080 --reload
    ports:
      - "8080:8080"
    environment:
      DJANGO_SETTINGS_MODULE: app.settings
      POSTGRES_DB: web_scrape_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: s3cr3t
      DATABASE_HOST: db
      DATABASE_PORT: 5433  # Make sure this matches the external port
    networks:
      - web_data_scrape_network
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
          
  db:
    image: postgres:latest
    container_name: postgres_web_scrape_db
    environment:
      POSTGRES_DB: web_scrape_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: s3cr3t
      PGPORT: 5433
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web_data_scrape_network

networks:
  web_data_scrape_network:
    external: true

volumes:
  staticfiles:
  media:
  postgres_data:

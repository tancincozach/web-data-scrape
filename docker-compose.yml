services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web_scrape
    command: uvicorn app.asgi:application --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=app.settings
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media

volumes:
  media:
  staticfiles:
